name: Daily Knowledge Base Update

on:
  schedule:
    # 每天北京时间8:00 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ===== 知识库新鲜度检查 =====
      - name: Check Knowledge Base Freshness
        id: kb_check
        run: |
          echo "🔄 知识库新鲜度检查 - $(date +%Y-%m-%d)"
          
          # 运行检查脚本，更新 tracker 状态
          REPORT=$(node scripts/knowledge-check.js --update --markdown 2>&1)
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # 检查是否有 stale 的高优先级模块
          if echo "$REPORT" | grep -q "🔴.*过期"; then
            echo "has_stale=true" >> $GITHUB_OUTPUT
          else
            echo "has_stale=false" >> $GITHUB_OUTPUT
          fi

      # ===== 更新每日寄语种子 =====
      - name: Update Daily Quote Seed
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src/data/knowledge/psychologistQuotes.js';
            let content = fs.readFileSync(path, 'utf8');
            const today = new Date().toISOString().split('T')[0];
            if (content.includes('// lastUpdated:')) {
              content = content.replace(/\\/\\/ lastUpdated:.*\\n/, '// lastUpdated: ' + today + '\\n');
            } else {
              content = '// lastUpdated: ' + today + '\\n' + content;
            }
            fs.writeFileSync(path, content);
            console.log('✅ 每日寄语种子已更新: ' + today);
          "

      # ===== 提交 tracker 更新 =====
      - name: Commit Tracker Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/knowledge-tracker.json src/data/knowledge/psychologistQuotes.js
          if git diff --cached --quiet; then
            echo "ℹ️ 无变更需要提交"
          else
            git commit -m "📚 daily: knowledge base check - $(date +%Y-%m-%d)"
            git push
          fi

      # ===== 创建过期提醒 Issue =====
      - name: Create Stale Module Issue
        if: steps.kb_check.outputs.has_stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.kb_check.outputs.report }}`;
            const date = new Date().toISOString().split('T')[0];
            
            // 检查是否已有未关闭的同名 issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['knowledge-stale'],
              per_page: 5
            });
            
            // 如果已有相同日期的 issue，跳过
            const existingIssue = issues.data.find(i => i.title.includes(date));
            if (existingIssue) {
              console.log('已有今日提醒 issue #' + existingIssue.number);
              return;
            }
            
            // 关闭之前的过期提醒 issue
            for (const oldIssue of issues.data) {
              if (oldIssue.title.includes('知识库过期提醒') && !oldIssue.title.includes(date)) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: oldIssue.number,
                  state: 'closed',
                  labels: ['knowledge-stale', 'resolved']
                });
              }
            }
            
            // 创建新 issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📚 知识库过期提醒 - ${date}`,
              body: report,
              labels: ['knowledge-stale', 'enhancement']
            });

      # ===== 构建验证 =====
      - name: Build verification
        run: |
          npm run build
          echo "✅ 构建验证通过"