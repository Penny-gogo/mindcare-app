<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindCare - 专业心理咨询平台</title>
  </head>
  <body>
    <div id="root">
      <div id="loading-fallback" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;color:#666">
        <div style="font-size:48px;margin-bottom:16px">💚</div>
        <h2 style="color:#1a1a2e;margin-bottom:8px">MindCare</h2>
        <p id="loading-status">正在加载...</p>
        <noscript><p style="color:#e74c3c;margin-top:16px">请启用JavaScript以使用此应用。</p></noscript>
      </div>
    </div>
    <script>
      // 增强诊断脚本 - 捕获错误并主动测试资源可达性
      window.__mindcareDebug = { errors: [], startTime: Date.now(), fetchTest: null };
      var statusEl = document.getElementById('loading-status');
      
      function showStatus(msg) { if (statusEl) statusEl.textContent = msg; }
      function showError(msg) {
        if (statusEl) statusEl.textContent = msg;
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding:40px;text-align:center;font-family:system-ui;max-width:600px;margin:0 auto">'
            + '<h2 style="color:#e74c3c">加载出错</h2>'
            + '<p style="color:#666;word-break:break-all;margin:16px 0">' + msg + '</p>'
            + '<button onclick="location.reload()" style="margin-top:16px;padding:8px 20px;background:#4a6cf7;color:#fff;border:none;border-radius:6px;cursor:pointer">刷新重试</button>'
            + '</div>';
        }
      }
      
      // 捕获同步错误
      window.onerror = function(msg, url, line, col, error) {
        window.__mindcareDebug.errors.push({ type: 'sync', msg: String(msg), url: url, line: line });
        showError('JS错误: ' + msg + ' (行' + line + ')');
      };
      
      // 捕获未处理的Promise rejection
      window.addEventListener('unhandledrejection', function(e) {
        window.__mindcareDebug.errors.push({ type: 'promise', msg: String(e.reason) });
      });
      
      // 捕获资源加载错误
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var url = e.target.src || e.target.href;
          window.__mindcareDebug.errors.push({ type: 'resource', msg: '资源加载失败: ' + url });
          // 主动测试资源可达性
          fetch(url, { mode: 'cors' }).then(function(r) {
            return r.text().then(function(t) {
              window.__mindcareDebug.fetchTest = { status: r.status, type: r.headers.get('content-type'), size: t.length, ok: r.ok };
              showError('模块加载失败(但资源可访问) HTTP=' + r.status + ' Type=' + r.headers.get('content-type') + ' Size=' + t.length + ' — 可能是CORS或MIME类型问题');
            });
          }).catch(function(err) {
            window.__mindcareDebug.fetchTest = { error: err.message };
            showError('模块加载失败(资源也不可访问): ' + err.message);
          });
        }
      }, true);
      
      showStatus('正在初始化应用...');
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
